<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | MapaUVG</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
      }
      #unity-container.unity-desktop {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        right: auto !important;
        bottom: auto !important;
        float: none !important;
        transform: translate(-50%, -50%) !important;
        width: 100%;
        max-width: 800px;
        margin: 0 !important;
      }
      #play-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        cursor: pointer;
      }
      #play-button {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transition: filter 0.15s ease;
      }
      #play-overlay:hover #play-button {
        filter: brightness(0.75);
      }
      #play-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        pointer-events: none;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }
      #play-label .play-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      #play-overlay:hover .play-icon {
        transform: scale(1.08);
        background: rgba(0, 0, 0, 0.75);
      }
      #play-label .play-icon svg {
        width: 26px;
        height: 26px;
        fill: #fff;
        margin-left: 4px;
      }
      #play-label span {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      /* Loading overlay */
      #load-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #101010;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #load-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #load-percent {
        font-size: 15px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas
        id="unity-canvas"
        width="1920"
        height="1080"
        tabindex="-1"
      ></canvas>

      <div id="play-overlay" style="display: none">
        <img
          id="play-button"
          src="TemplateData/Campus-Central-UVG.webp"
          alt="Mapa UVG"
        />
        <div id="play-label">
          <div class="play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </div>
          <span>Presiona para ver el mapa</span>
        </div>
      </div>

      <div id="load-overlay">
        <div id="load-spinner"></div>
        <div id="load-percent">Cargando... 0%</div>
      </div>

      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MapaUVGPart2.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MapaUVGPart2.data",
        frameworkUrl: buildUrl + "/MapaUVGPart2.framework.js",
        codeUrl: buildUrl + "/MapaUVGPart2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MapaUVG",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;
      } else {
        // Desktop style: start as a small embedded preview (16:9), scaled to
        // fit its container, instead of a fixed 1920x1080 box. Clicking the
        // fullscreen button (wired up below) expands it to true fullscreen.
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        canvas.style.aspectRatio = "16 / 9";
        canvas.style.display = "block";
        canvas.style.cursor = "pointer";

        // Block interaction with the scene while it's just a small preview —
        // it should only be playable once the user enters fullscreen via the
        // play button.
        canvas.style.pointerEvents = "none";
      }

      var loadOverlay = document.querySelector("#load-overlay");
      var loadPercent = document.querySelector("#load-percent");
      var playOverlay = document.querySelector("#play-overlay");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var pct = Math.round(100 * progress);
          loadPercent.textContent = "Cargando... " + pct + "%";
        })
          .then((unityInstance) => {
            // Loading finished: hide the spinner, show the "press to see
            // the map" overlay instead of the canvas being interactive.
            loadOverlay.style.display = "none";
            playOverlay.style.display = "block";

            function enterFullscreen() {
              unityInstance.SetFullscreen(1);
              playOverlay.style.display = "none";
              canvas.style.pointerEvents = "auto";
            }

            function exitedFullscreen() {
              playOverlay.style.display = "block";
              canvas.style.pointerEvents = "none";
            }

            // Clicking the play overlay (image + label) goes fullscreen
            playOverlay.onclick = enterFullscreen;

            // Detect when the user leaves fullscreen (Esc key, browser UI,
            // etc.) and bring back the play button so the scene can only
            // be played again once fullscreen is re-entered.
            function handleFullscreenChange() {
              var fsElement =
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement;

              if (!fsElement) {
                exitedFullscreen();
              }
            }

            document.addEventListener(
              "fullscreenchange",
              handleFullscreenChange,
            );
            document.addEventListener(
              "webkitfullscreenchange",
              handleFullscreenChange,
            );
            document.addEventListener(
              "mozfullscreenchange",
              handleFullscreenChange,
            );
            document.addEventListener(
              "MSFullscreenChange",
              handleFullscreenChange,
            );
          })
          .catch((message) => {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
