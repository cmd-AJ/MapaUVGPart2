<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- Must be present at parse time. If this is injected later by script,
         mobile browsers lay the page out in a ~980px fallback viewport first,
         and any window.innerWidth read before that point is wrong. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Unity Web Player | MAPAURPUVG</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        overscroll-behavior: none;
      }

      /* Applies whether the container ends up .unity-desktop or .unity-mobile.
         The ID + class selectors here match the specificity of the template's
         own rules in TemplateData/style.css and load after it, so these win. */
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        height: 100%;
        height: 100dvh; /* tracks mobile browser chrome; ignored where unsupported */
      }

      #unity-container.unity-desktop #unity-canvas,
      #unity-container.unity-mobile #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        /* Stop the browser from claiming touch gestures for scroll/zoom before
           Unity sees them — otherwise drags on the map get eaten. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Floating fullscreen toggle drawn over the scene */
      #uvg-fs-toggle {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: calc(16px + env(safe-area-inset-right, 0px));
        z-index: 30;
        width: 44px;
        height: 44px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      #uvg-fs-toggle:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: scale(1.08);
      }
      #uvg-fs-toggle:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      #uvg-fs-toggle svg {
        width: 20px;
        height: 20px;
        fill: #fff;
        pointer-events: none;
      }
      #uvg-fs-toggle .icon-exit {
        display: none;
      }
      #uvg-fs-toggle.is-fullscreen .icon-enter {
        display: none;
      }
      #uvg-fs-toggle.is-fullscreen .icon-exit {
        display: block;
      }

      /* Touch targets under 48px are hard to hit; bump it on coarse pointers. */
      @media (pointer: coarse) {
        #uvg-fs-toggle {
          width: 48px;
          height: 48px;
        }
        #uvg-fs-toggle:hover {
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #uvg-fs-toggle {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <button id="uvg-fs-toggle" type="button" aria-label="Pantalla completa">
        <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 9V4h5v2H6v3H4zm0 6h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3zM15 6V4h5v5h-2V6h-3z"
          />
        </svg>
        <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9 4h2v5H6V7h3V4zm4 0h2v3h3v2h-5V4zM6 15h5v5H9v-3H6v-2zm7 0h5v2h-3v3h-2v-5z"
          />
        </svg>
      </button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MapaUVGPart2.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MapaUVGPart2.data",
        frameworkUrl: buildUrl + "/MapaUVGPart2.framework.js",
        codeUrl: buildUrl + "/MapaUVGPart2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MAPAURPUVG",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        webGLContextAttributes: {
          powerPreference: "high-performance",
        },
      };

      // --- Mobile detection --------------------------------------------------
      // Runs BEFORE the pixel ratio is computed. The old order computed the
      // ratio first, which meant it measured whatever viewport existed before
      // the mobile class was applied.
      var isMobile =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isMobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // --- Render resolution -------------------------------------------------
      // Render at the panel's native pixel density. Anything less means the
      // browser upscales the buffer to fill the display, and UI text is the
      // first thing that visibly softens.
      //
      // MAX_DPR is capped at 2 rather than 3: on a 3x phone panel the third
      // multiple costs 2.25x the fill rate of 2x for a difference almost
      // nobody can resolve at arm's length.
      var MAX_DPR = 2;

      // Floor for the adaptive step-down below. 1.0 = one rendered pixel per
      // CSS pixel, which still looks soft on a retina display but is legible.
      // Raise to MAX_DPR to disable quality reduction entirely and accept
      // whatever frame rate the device gives.
      var MIN_DPR = 1;

      // Set by the adaptive pass once it has measured real frame times.
      var qualityScale = 1;

      function computeDevicePixelRatio() {
        var dpr = window.devicePixelRatio || 1;
        return Math.max(MIN_DPR, Math.min(dpr, MAX_DPR) * qualityScale);
      }

      config.devicePixelRatio = computeDevicePixelRatio();

      var unityInstance = null;

      // Rotating a phone changes the aspect ratio and therefore the pixel
      // budget. Recompute and push the new ratio into the running instance.
      // Module.devicePixelRatio is read by Unity's canvas sizing each frame;
      // guarded because it is not a documented public API.
      function refreshDevicePixelRatio() {
        var dpr = computeDevicePixelRatio();
        config.devicePixelRatio = dpr;
        try {
          if (unityInstance && unityInstance.Module) {
            unityInstance.Module.devicePixelRatio = dpr;
          }
        } catch (e) {}
      }

      // Unity reads the canvas size on resize, but the browser reports the new
      // size before the layout/chrome transition has finished on mobile. Fire
      // again after a beat so it settles on the final dimensions.
      function nudgeResize() {
        refreshDevicePixelRatio();
        setTimeout(function () {
          refreshDevicePixelRatio();
          window.dispatchEvent(new Event("resize"));
        }, 150);
        setTimeout(function () {
          refreshDevicePixelRatio();
          window.dispatchEvent(new Event("resize"));
        }, 400);
      }

      window.addEventListener("orientationchange", nudgeResize);
      if (window.visualViewport) {
        // Fires when the mobile URL bar collapses or expands, which changes
        // the usable height without always firing a window resize.
        window.visualViewport.addEventListener(
          "resize",
          refreshDevicePixelRatio,
        );
      }

      // Block pinch-zoom and double-tap-zoom on the canvas so map gestures
      // reach Unity instead of zooming the page.
      canvas.addEventListener(
        "gesturestart",
        function (e) {
          e.preventDefault();
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchmove",
        function (e) {
          if (e.touches.length > 1) e.preventDefault();
        },
        { passive: false },
      );

      document.querySelector("#unity-loading-bar").style.display = "block";

      // --- Fullscreen toggle -------------------------------------------------
      // Uses the browser Fullscreen API on the container (not Unity's
      // SetFullscreen) so the HTML button stays drawn on top of the scene and
      // can be clicked to exit again.
      var fsToggle = document.querySelector("#uvg-fs-toggle");
      var fsTarget = container;

      var fsSupported = !!(
        fsTarget.requestFullscreen ||
        fsTarget.webkitRequestFullscreen ||
        fsTarget.mozRequestFullScreen ||
        fsTarget.msRequestFullscreen
      );

      function fsElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      }

      function enterFs() {
        var fn =
          fsTarget.requestFullscreen ||
          fsTarget.webkitRequestFullscreen ||
          fsTarget.mozRequestFullScreen ||
          fsTarget.msRequestFullscreen;
        if (!fn) return;
        try {
          var p = fn.call(fsTarget);
          if (p && typeof p.catch === "function") p.catch(function () {});
        } catch (e) {}
      }

      function exitFs() {
        var fn =
          document.exitFullscreen ||
          document.webkitExitFullscreen ||
          document.mozCancelFullScreen ||
          document.msExitFullscreen;
        if (!fn) return;
        try {
          var p = fn.call(document);
          if (p && typeof p.catch === "function") p.catch(function () {});
        } catch (e) {}
      }

      fsToggle.addEventListener("click", function () {
        if (fsElement()) exitFs();
        else enterFs();
      });

      // Keep the icon in sync however fullscreen was entered or left (Esc,
      // browser UI, the parent page's overlay, etc).
      [
        "fullscreenchange",
        "webkitfullscreenchange",
        "mozfullscreenchange",
        "MSFullscreenChange",
      ].forEach(function (evt) {
        document.addEventListener(evt, function () {
          var active = !!fsElement();
          fsToggle.classList.toggle("is-fullscreen", active);
          fsToggle.setAttribute(
            "aria-label",
            active ? "Salir de pantalla completa" : "Pantalla completa",
          );
          nudgeResize();
        });
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width =
            100 * progress + "%";
        })
          .then((instance) => {
            unityInstance = instance;
            document.querySelector("#unity-loading-bar").style.display = "none";
            // iPhone Safari has no Fullscreen API for non-video elements, so
            // showing a button that silently does nothing is worse than
            // hiding it.
            if (fsSupported) fsToggle.style.display = "flex";
            nudgeResize();
          })
          .catch((message) => {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
