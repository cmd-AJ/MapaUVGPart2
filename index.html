    <style>
      #uvg-unity-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #1a1a1a;
      }
      #uvg-unity-overlay.uvg-open {
        display: block;
      }

      #uvg-unity-close {
        position: absolute;
        top: 14px;
        right: 18px;
        z-index: 10;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      #uvg-unity-close:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      #uvg-unity-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      #uvg-unity-load {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #101010;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #uvg-unity-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: uvg-spin 0.9s linear infinite;
      }
      @keyframes uvg-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Bloquea el scroll del body mientras el mapa está abierto: evita
     que Divi / Hotjar disparen handlers de scroll durante el gameplay. */
      body.uvg-map-open {
        overflow: hidden;
      }

      #imagen2342813198608,
      #imagen342813198608 {
        cursor: pointer;
        display: block;
      }

      .uvg-map-trigger {
        position: relative;
        display: inline-block;
        width: 100%;
        cursor: pointer;
      }
      .uvg-map-hint {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        pointer-events: none;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        text-align: center;
        padding: 0 16px;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .uvg-map-trigger:hover .uvg-map-hint {
        opacity: 1;
      }
      .uvg-map-hint .uvg-play-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .uvg-map-trigger:hover .uvg-play-icon {
        transform: scale(1.08);
        background: rgba(0, 0, 0, 0.75);
      }
      .uvg-map-trigger:hover img {
        filter: brightness(0.75);
      }
      .uvg-map-hint .uvg-play-icon svg {
        width: 26px;
        height: 26px;
        fill: #fff;
        margin-left: 4px;
      }
      .uvg-map-hint span {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
    </style>

    <div id="uvg-unity-overlay">
      <button id="uvg-unity-close" aria-label="Cerrar mapa">&times;</button>
      <iframe
        id="uvg-unity-frame"
        title="Mapa 3D UVG"
        allow="fullscreen; autoplay; gamepad; xr-spatial-tracking"
        allowfullscreen
      ></iframe>
      <div id="uvg-unity-load">
        <div id="uvg-unity-spinner"></div>
        <div id="uvg-unity-percent">Cargando mapa...</div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ─────────────────────────────────────────────────────────────
        // AJUSTA ESTA RUTA: debe apuntar al index.html standalone de Unity
        // (el archivo que ya te corre fluido por sí solo).
        // ─────────────────────────────────────────────────────────────
        var UNITY_PAGE = "/mapa3d/index.html";

        var overlay = document.getElementById("uvg-unity-overlay");
        var closeBtn = document.getElementById("uvg-unity-close");
        var frame = document.getElementById("uvg-unity-frame");
        var loadBox = document.getElementById("uvg-unity-load");
        var loaded = false;
        var preconnected = false;

        // Precarga la conexión al hacer hover, para que al hacer clic
        // el .wasm y el .data empiecen a bajar de inmediato.
        function preconnect() {
          if (preconnected) return;
          preconnected = true;
          var link = document.createElement("link");
          link.rel = "prefetch";
          link.href = UNITY_PAGE;
          document.head.appendChild(link);
        }

        function openMap() {
          if (overlay.classList.contains("uvg-open")) return;

          overlay.classList.add("uvg-open");
          document.body.classList.add("uvg-map-open");

          if (!loaded) {
            loaded = true;
            frame.src = UNITY_PAGE;
            frame.addEventListener("load", function () {
              // El iframe ya pintó; Unity sigue cargando su propio progreso
              // dentro del iframe, así que ocultamos nuestro spinner al terminar.
              loadBox.style.display = "none";
            });
          }

          // Enfoca el iframe para que el teclado/mouse vayan directo a Unity
          // y no queden atrapados por handlers del sitio padre.
          setTimeout(function () {
            try {
              frame.contentWindow.focus();
            } catch (e) {}
          }, 50);
        }

        function closeMap() {
          overlay.classList.remove("uvg-open");
          document.body.classList.remove("uvg-map-open");

          // Descomenta si quieres liberar memoria/GPU al cerrar
          // (a costa de recargar Unity la próxima vez):
          // frame.src = "about:blank"; loaded = false; loadBox.style.display = "flex";
        }

        closeBtn.addEventListener("click", closeMap);

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && overlay.classList.contains("uvg-open"))
            closeMap();
        });

        var triggers = document.querySelectorAll(
          ".uvg-map-trigger, #imagen2342813198608, #imagen342813198608",
        );
        Array.prototype.forEach.call(triggers, function (el) {
          el.addEventListener("click", openMap);
          el.addEventListener("mouseenter", preconnect, { once: true });
        });
      })();
    </script></iframe
  ></iframe
